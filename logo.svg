<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <!-- Circuit & Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Badge Background -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" stroke="#b91c1c" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Network Circuit Lines (TKJ Accent) -->
  <path d="M 16 28 L 28 28 L 35 38" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <circle cx="16" cy="28" r="2.5" fill="#fca5a5" opacity="0.8"/>

  <path d="M 84 72 L 72 72 L 65 62" fill="none" stroke="#f87171" stroke-width="1.8" stroke-linecap="round" opacity="0.45"/>
  <circle cx="84" cy="72" r="2.5" fill="#fca5a5" opacity="0.8"/>

  <!-- Modern Monogram "W" (Wisnu + Tech/TKJ Network Nodes) -->
  <!-- Left to Bottom-Center-Left -->
  <path d="M 24 33 L 38 71 L 50 47 L 62 71 L 76 33" 
        fill="none" 
        stroke="url(#lineGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Node Dots at the Vertices of W -->
  <circle cx="24" cy="33" r="4.2" fill="#ffffff" stroke="#991b1b" stroke-width="2"/>
  <circle cx="38" cy="71" r="3.8" fill="#ffffff" stroke="#991b1b" stroke-width="2"/>
  <circle cx="50" cy="47" r="4.2" fill="#fca5a5" stroke="#450a0a" stroke-width="2"/>
  <circle cx="62" cy="71" r="3.8" fill="#ffffff" stroke="#991b1b" stroke-width="2"/>
  <circle cx="76" cy="33" r="4.2" fill="#ffffff" stroke="#991b1b" stroke-width="2"/>
</svg>

